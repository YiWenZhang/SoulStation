version: '3.8'

services:
  # 后端服务
  backend:
    build: ./back
    container_name: soulstation-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=soulstation
      - AI_API_KEY=${AI_API_KEY} # 读取宿主机环境变量
    depends_on:
      - mysql

  # 数据库服务
  mysql:
    image: mysql:8.0
    container_name: soulstation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soulstation
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: